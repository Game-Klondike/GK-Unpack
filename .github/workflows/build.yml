# Builds gk-unpack.exe on Windows (MSVC) from this repository on every change; a tag v* also publishes it as a release.
name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # the release step (tags only)
    steps:
      - uses: actions/checkout@v4
      - name: Build gk-unpack.exe
        shell: cmd
        run: build.cmd
      - name: Check that it runs (no arguments → usage, exit code 1)
        shell: pwsh
        run: |
          & .\gk-unpack.exe 2>$null
          if ($LASTEXITCODE -ne 1) { throw "expected exit code 1 without arguments, got $LASTEXITCODE" }
          exit 0 # the step would otherwise end with the program's own (expected) exit code 1
      - uses: actions/upload-artifact@v4
        with:
          name: gk-unpack
          path: gk-unpack.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" gk-unpack.exe --title "gk-unpack ${{ github.ref_name }}" --notes "Built from this tag by GitHub Actions. Source: this repository (GPL-3.0-or-later)."
